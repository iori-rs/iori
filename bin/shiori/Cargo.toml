[package]
name = "shiori"
description = "A brand new video stream downloader"
version = "0.2.6"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
iori = { workspace = true, features = ["opendal-fs"] }
iori-nicolive.workspace = true
iori-showroom.workspace = true
iori-gigafile.workspace = true
uri-match.workspace = true

tokio = { workspace = true, features = ["full"] }
reqwest.workspace = true
fake_user_agent.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true

clap.workspace = true
clap-handler = { version = "0.1.2", features = ["async"] }
rand = "0.9.0"
regex.workspace = true
async-recursion.workspace = true
shlex = "1.3.0"
rmp-serde.workspace = true
base64.workspace = true
chrono = "0.4.39"
ratatui = "0.29.0"
crossterm = "0.28.1"

shiori-plugin.workspace = true
tracing-subscriber.workspace = true
self_update = { version = "0.42.0", default-features = false, features = [
    "rustls",
    "compression-zip-deflate",
    "compression-flate2",
] }

i18n-embed = { version = "0.15.4", features = [
    "fluent-system",
    "desktop-requester",
    "filesystem-assets",
] }
i18n-embed-fl = "0.9.4"
rust-embed = "8.7.0"

ssup = { git = "https://github.com/Yesterday17/sswa", rev = "2986c11619d55e825f69cca24b122c7cfc9a6587" }
serde_json.workspace = true

[build-dependencies]
winresource = "0.1.22"

[features]
default = []
ffmpeg = ["iori/ffmpeg"]

[[bin]]
name = "shiori"
path = "src/main.rs"
